<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table QR Studio & Tent Card Generator | diner-flow</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
            slate: {
              850: '#151f32',
              900: '#0f172a',
              950: '#0b0f19'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950 antialiased">

  <!-- Header -->
  <header class="glass-panel sticky top-0 z-40 border-b border-slate-800 px-4 sm:px-8 py-3.5 no-print">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-600 p-0.5 shadow-lg shadow-amber-500/20 flex-shrink-0">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-lg">
            🖨️
          </div>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg text-white">
            Table QR Studio & Tent Card Generator
          </h1>
          <p class="text-xs text-slate-400">
            Generate printable high-res QR tent cards for tables 1–20
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a 
          href="index.html" 
          class="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 text-xs font-semibold transition-colors">
          🍽️ Customer Menu
        </a>
        <button 
          onclick="printAllQRCards()"
          class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg shadow-amber-500/25 flex items-center gap-1.5 transition-all">
          <span>🖨️</span>
          <span>Print All Cards</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Studio Customization Controls Panel -->
  <section class="max-w-7xl mx-auto px-4 sm:px-8 pt-6 pb-4 w-full no-print">
    <div class="glass-panel-gold p-5 sm:p-6 rounded-3xl border border-amber-500/30">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="font-bold text-lg text-white">Tent Card Customization</h2>
          <p class="text-xs text-slate-300">Live configuration automatically reflects on the printable cards below.</p>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-mono font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
          Instant Auto-Generate
        </span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5">
        <!-- Cafe Name -->
        <div class="lg:col-span-2">
          <label class="block text-xs font-semibold text-slate-300 mb-1">Restaurant / Cafe Name</label>
          <input 
            type="text" 
            id="qrStudioCafeName" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
          />
        </div>

        <!-- Tagline -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Call to Action Tagline</label>
          <input 
            type="text" 
            id="qrStudioTagline" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
          />
        </div>

        <!-- Table Count -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Total Tables Count</label>
          <input 
            type="number" 
            id="qrStudioTableCount" 
            min="1" 
            max="50"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
          />
        </div>

        <!-- Wi-Fi Details -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Guest Wi-Fi SSID</label>
          <input 
            type="text" 
            id="qrStudioWifiName" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500"
          />
        </div>
      </div>
    </div>
  </section>

  <!-- Generated QR Cards Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-8 py-6 flex-1 w-full">
    <div id="qrCardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Dynamically generated QR tent cards -->
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/qr-studio.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
